name: horizon
services:
  api:
    image: ${HORIZON_IMAGE:?Set the immutable release image}
    restart: unless-stopped
    env_file:
      - /opt/horizon/shared/backend.env
    environment:
      HORIZON_REQUIRE_API_KEY: "1"
    ports:
      - "${HORIZON_BIND_ADDRESS:-0.0.0.0}:${HORIZON_HTTP_PORT:-80}:8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.runtime:size=16m,uid=10001,gid=10001,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 128
    stop_grace_period: 75s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
